name: Release macOS

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to, for example v0.16.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  CXXFLAGS: -I$(xcrun --show-sdk-path)/usr/include/c++/v1
  TAURI_CLI_VERSION: "2.10.1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release_readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact release tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "ERROR: release input must be an exact version tag" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Verify committed release invariants
        run: node scripts/check_version_sync.mjs --release

  macos-release:
    name: Build signed + notarized Minutes.app
    needs: release_readiness
    runs-on: macos-latest
    # Scopes the Apple signing secrets to this workflow instead of leaving
    # them readable by every workflow in a public repository. The environment
    # deliberately carries no required reviewer -- it exists to confine the
    # credentials, not to add an approval step -- and its ref policy allows
    # `main` and `v*` tags, which is exactly how this workflow is triggered,
    # so release behaviour is unchanged.
    environment: production-release

    steps:
      - name: Validate exact release tag input
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "ERROR: release input must be an exact version tag" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ format('refs/tags/{0}', env.RELEASE_TAG) }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify checked out release ref
        run: |
          tag_ref="refs/tags/$RELEASE_TAG"
          git show-ref --verify --quiet "$tag_ref"
          tag_commit="$(git rev-parse "${tag_ref}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "ERROR: checkout HEAD ($head_commit) does not match ${RELEASE_TAG} ($tag_commit)" >&2
            exit 1
          fi

      - name: Set C++ include path for whisper.cpp
        run: echo "CXXFLAGS=-I$(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Resolve runner image for cache scope
        id: runner-image
        shell: bash
        run: echo "scope=${ImageOS:-noimage}-${ImageVersion:-noversion}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Scope by runner image so a runner-image rotation (e.g. macos-latest moving
          # from macOS 15 to macOS 26) does not restore a stale target/ cache with
          # linker paths for an Xcode the new image no longer ships. See ci.yml.
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Validate signing and notarization secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required release secrets: ${missing[*]}" >&2
            echo "See docs/release/platform-macos.md for the expected values." >&2
            exit 1
          fi

      - name: Materialize App Store Connect key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import Developer ID identity into an ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/minutes-release.keychain-db"
          certificate="$RUNNER_TEMP/minutes-release.p12"
          keychain_password="$(openssl rand -hex 24)"
          python3 - "$certificate" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"], validate=True)
          )
          PY
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" \
            | grep -Fq "$APPLE_SIGNING_IDENTITY"
          echo "MINUTES_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      # The bundle ships the CLI as a sidecar (in-app "Set up CLI" symlinks to
      # it). build.rs stages it from target/release/minutes, so the CLI must be
      # built first or the bundle ships a placeholder stub (#324).
      - name: Build release CLI for bundling
        run: cargo build --release -p minutes-cli --features parakeet,metal,engine-sherpa

      - name: Build signed bundle (helper identity is repaired before notarization)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          MINUTES_REQUIRE_REAL_CLI_SIDECAR: "1"
        run: cargo tauri build --features parakeet,metal,engine-sherpa --bundles app

      - name: Sign graph helper inside-out and notarize the final exact app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -euo pipefail
          app="target/release/bundle/macos/Minutes.app"
          sidecar="target/release/bundle/macos/Minutes.app/Contents/MacOS/minutes"
          staged_graph_worker="$app/Contents/MacOS/minutes-graph-worker"
          staged_apple_speech_worker="$app/Contents/MacOS/minutes-apple-speech-worker"
          test -f "$sidecar" || { echo "ERROR: bundled CLI sidecar missing" >&2; exit 1; }
          test -f "$staged_graph_worker" || { echo "ERROR: bundled graph worker missing" >&2; exit 1; }
          test -f "$staged_apple_speech_worker" || { echo "ERROR: bundled Apple Speech worker missing" >&2; exit 1; }
          size=$(stat -f%z "$sidecar")
          echo "bundled CLI sidecar size: $size bytes"
          if [ "$size" -lt 10000000 ]; then
            echo "ERROR: bundled CLI sidecar is too small to be the real binary (placeholder? #324)" >&2
            exit 1
          fi
          file "$sidecar" | grep -q "Mach-O" || { echo "ERROR: bundled CLI sidecar is not a Mach-O binary" >&2; exit 1; }
          file "$staged_graph_worker" | grep -q "Mach-O" || { echo "ERROR: bundled graph worker is not a Mach-O binary" >&2; exit 1; }
          file "$staged_apple_speech_worker" | grep -q "Mach-O" || { echo "ERROR: bundled Apple Speech worker is not a Mach-O binary" >&2; exit 1; }

          codesign --force --options runtime --timestamp \
            --entitlements tauri/src-tauri/minutes-cli.entitlements \
            --sign "$APPLE_SIGNING_IDENTITY" "$sidecar"
          ./scripts/package-graph-xpc.sh \
            "$app" \
            "$APPLE_SIGNING_IDENTITY" \
            tauri/src-tauri/minutes-graph-worker.entitlements
          ./scripts/package-apple-speech-xpc.sh \
            "$app" \
            "$APPLE_SIGNING_IDENTITY" \
            tauri/src-tauri/minutes-apple-speech-worker.entitlements
          graph_worker_bundle="$app/Contents/XPCServices/com.useminutes.graph-worker.xpc"
          graph_worker="$graph_worker_bundle/Contents/MacOS/minutes-graph-worker"
          apple_speech_worker_bundle="$app/Contents/XPCServices/com.useminutes.apple-speech-worker.xpc"
          apple_speech_worker="$apple_speech_worker_bundle/Contents/MacOS/minutes-apple-speech-worker"
          test ! -e "$staged_graph_worker"
          test ! -e "$staged_apple_speech_worker"
          test -f "$graph_worker"
          test -f "$apple_speech_worker"

          codesign --force --options runtime --timestamp \
            --entitlements tauri/src-tauri/entitlements.plist \
            --sign "$APPLE_SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --verify --strict --verbose=4 "$graph_worker_bundle"
          codesign --verify --strict --verbose=4 "$apple_speech_worker_bundle"

          codesign -d --entitlements :- "$graph_worker" \
            > "$RUNNER_TEMP/graph-worker-entitlements.plist" 2>/dev/null
          python3 - "$RUNNER_TEMP/graph-worker-entitlements.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as source:
              actual = plistlib.load(source)
          expected = {"com.apple.security.app-sandbox": True}
          if actual != expected:
              raise SystemExit(
                  f"graph worker entitlement allowlist mismatch: {actual!r}"
              )
          PY
          codesign -d --entitlements :- "$apple_speech_worker" \
            > "$RUNNER_TEMP/apple-speech-worker-entitlements.plist" 2>/dev/null
          python3 - "$RUNNER_TEMP/apple-speech-worker-entitlements.plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as source:
              actual = plistlib.load(source)
          expected = {"com.apple.security.app-sandbox": True}
          if actual != expected:
              raise SystemExit(
                  f"Apple Speech worker entitlement allowlist mismatch: {actual!r}"
              )
          PY
          codesign -dv --verbose=4 "$graph_worker" \
            > "$RUNNER_TEMP/graph-worker-identity.txt" 2>&1
          grep -Fq "Identifier=com.useminutes.graph-worker" \
            "$RUNNER_TEMP/graph-worker-identity.txt"
          grep -Fq "TeamIdentifier=63TMLKT8HN" \
            "$RUNNER_TEMP/graph-worker-identity.txt"
          codesign -dv --verbose=4 "$apple_speech_worker" \
            > "$RUNNER_TEMP/apple-speech-worker-identity.txt" 2>&1
          grep -Fq "Identifier=com.useminutes.apple-speech-worker" \
            "$RUNNER_TEMP/apple-speech-worker-identity.txt"
          grep -Fq "TeamIdentifier=63TMLKT8HN" \
            "$RUNNER_TEMP/apple-speech-worker-identity.txt"

          notary_zip="$RUNNER_TEMP/Minutes-final.zip"
          ditto -c -k --keepParent "$app" "$notary_zip"
          xcrun notarytool submit "$notary_zip" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app"

          updater="target/release/bundle/macos/Minutes.app.tar.gz"
          rm -f "$updater" "$updater.sig"
          tar -C "target/release/bundle/macos" -czf "$updater" "Minutes.app"
          cargo tauri signer sign "$updater"
          test -s "$updater.sig"

      - name: Create DMG
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          dmg="target/release/bundle/dmg/Minutes_${VERSION}_aarch64.dmg"
          ./scripts/create-branded-dmg.sh \
            --app target/release/bundle/macos/Minutes.app \
            --version "$VERSION" \
            --output "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature \
            --verbose=4 "$dmg"

      - name: Remove ephemeral release signing material
        if: always()
        run: |
          if [ -n "${MINUTES_RELEASE_KEYCHAIN:-}" ]; then
            security delete-keychain "$MINUTES_RELEASE_KEYCHAIN" || true
          fi
          rm -f \
            "${APPLE_API_KEY_PATH:-}" \
            "$RUNNER_TEMP/minutes-release.p12" \
            "$RUNNER_TEMP/Minutes-final.zip" \
            "$RUNNER_TEMP/graph-worker-entitlements.plist" \
            "$RUNNER_TEMP/graph-worker-identity.txt" \
            "$RUNNER_TEMP/apple-speech-worker-entitlements.plist" \
            "$RUNNER_TEMP/apple-speech-worker-identity.txt"

      - name: Upload signed app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minutes-macos-app
          path: target/release/bundle/macos/Minutes.app
          if-no-files-found: error

      - name: Upload signed dmg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: minutes-macos-dmg
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Verify release exists before uploading assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${RELEASE_TAG}" >/dev/null

      - name: Generate latest.json for auto-updater
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          SIG=$(cat target/release/bundle/macos/Minutes.app.tar.gz.sig)
          if [ -z "$SIG" ]; then
            echo "ERROR: .sig file empty or missing" >&2
            exit 1
          fi
          URL="https://github.com/silverstein/minutes/releases/download/${RELEASE_TAG}/Minutes.app.tar.gz"
          NOTES=$(gh release view "${RELEASE_TAG}" --json body -q .body 2>/dev/null || echo "")
          export UPDATE_VERSION="$VERSION"
          export UPDATE_SIG="$SIG"
          export UPDATE_URL="$URL"
          export UPDATE_NOTES="$NOTES"
          python3 << 'PYEOF'
          import json, os, datetime
          data = {
              "version": os.environ["UPDATE_VERSION"],
              "notes": os.environ["UPDATE_NOTES"],
              "pub_date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "darwin-aarch64": {
                      "signature": os.environ["UPDATE_SIG"].strip(),
                      "url": os.environ["UPDATE_URL"]
                  }
              }
          }
          with open("target/release/bundle/macos/latest.json", "w") as f:
              json.dump(data, f, indent=2)
          PYEOF

      - name: Upload release assets to existing tag release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            target/release/bundle/dmg/*.dmg \
            target/release/bundle/macos/Minutes.app.tar.gz \
            target/release/bundle/macos/Minutes.app.tar.gz.sig \
            target/release/bundle/macos/latest.json \
            --clobber
