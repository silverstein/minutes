<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Note</title>
  <script src="scripts/customize-theme.js"></script>
  <script src="scripts/ui-zoom.js"></script>
  <script src="locales/zh-CN.js"></script>
  <script src="locales/pt-BR.js"></script>
  <script src="scripts/i18n.js"></script>
  <link rel="stylesheet" href="styles/ui-zoom-tokens.css">
  <style>
    @font-face {
      font-family: 'Instrument Serif';
      font-style: normal;
      font-weight: 400;
      src: url('fonts/InstrumentSerif-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Instrument Serif';
      font-style: italic;
      font-weight: 400;
      src: url('fonts/InstrumentSerif-Italic.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 400;
      src: url('fonts/Geist-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 500;
      src: url('fonts/Geist-Medium.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist';
      font-style: normal;
      font-weight: 600;
      src: url('fonts/Geist-SemiBold.woff2') format('woff2');
    }
    @font-face {
      font-family: 'Geist Mono';
      font-style: normal;
      font-weight: 400;
      src: url('fonts/GeistMono-Regular.woff2') format('woff2');
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      color-scheme: light dark;
      --bg: #0D0D0B;
      --on-accent: var(--bg);
      --bg-elevated: #141412;
      --bg-hover: #1C1C1A;
      --border: rgba(255, 255, 255, 0.06);
      --border-mid: #2A2924;
      --text: #E8E4DA;
      --text-secondary: #AAA49A;
      --text-tertiary: #716C64;
      --accent: #30D158;
      --accent-hover: #4ADE70;
      --accent-soft: rgba(48, 209, 88, 0.12);
      --red: #FF453A;
      --surface-fill: rgba(20, 20, 18, 0.96);
      --surface-fill-soft: rgba(255, 255, 255, 0.02);
      --inset-shadow: rgba(0, 0, 0, 0.14);
      --shadow:
        0 18px 34px rgba(0, 0, 0, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:             #F8F4ED;
        --bg-elevated:    #EFEBE2;
        --bg-hover:       #E8E2D8;
        --border:         rgba(0, 0, 0, 0.07);
        --border-mid:     rgba(0, 0, 0, 0.13);
        --text:           #1A1916;
        --text-secondary: #6F6A62;
        --text-tertiary:  #958F85;
        --accent:         #AE5337;
        --accent-hover:   #9E4428;
        --accent-soft:    rgba(174, 83, 55, 0.10);
        --red:            #C0392B;
        --surface-fill:   rgba(239, 235, 226, 0.96);
        --surface-fill-soft: rgba(0, 0, 0, 0.03);
        --inset-shadow:   rgba(0, 0, 0, 0.08);
        --shadow:
          0 18px 34px rgba(0, 0, 0, 0.12),
          inset 0 1px 0 rgba(0, 0, 0, 0.03);
      }
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-user-select: none;
      user-select: none;
    }

    /* The window is the container. A bordered card inside it spent ~56px of a
       260px window on frames, and the textarea, the one flexible child, was
       squeezed to nothing. */
    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 16px 16px;
    }

    .header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-family: 'Instrument Serif', ui-serif, Georgia, serif;
      font-size: var(--text-xl);
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .subtitle {
      font-size: var(--text-xs);
      line-height: 1.45;
      color: var(--text-secondary);
    }

    .input-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 3.5em;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    textarea {
      flex: 1;
      width: 100%;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: inherit;
      font-size: var(--text-sm);
      line-height: 1.55;
      resize: none;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    textarea:focus {
      box-shadow: none;
    }

    textarea::placeholder {
      color: var(--text-tertiary);
    }

    [hidden] { display: none !important; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .hint {
      font-size: var(--text-meta);
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .hint kbd {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      font-family: 'Geist Mono', 'SF Mono', monospace;
      font-size: var(--text-2xs);
      border: 1px solid var(--border-mid);
    }

    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      font-family: inherit;
      font-size: var(--text-body);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
      box-shadow: inset 0 -1px 0 var(--inset-shadow);
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-primary:disabled {
      background: var(--bg-hover);
      color: var(--text-tertiary);
      cursor: default;
      transform: none;
      box-shadow: none;
    }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(40px);
      background: var(--accent);
      color: var(--on-accent);
      font-size: var(--text-xs);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--red);
      color: var(--bg);
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="header">
      <div class="title" id="note-title">Add a note</div>
      <div class="subtitle" id="note-subtitle">Checking for a recording…</div>
    </div>
    <div class="input-wrap" id="note-compose" hidden>
      <textarea
        id="note-input"
        placeholder="What just happened…"
        autofocus
      ></textarea>
    </div>
    <div class="footer">
      <span class="hint" id="note-hint"><kbd>&#8984;Return</kbd> save <span style="opacity:.5">·</span> <kbd>Esc</kbd> close</span>
      <button class="btn btn-primary" id="save-btn" disabled>Save Note</button>
    </div>
  </div>
  <div class="toast" id="toast">Note saved</div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const { getCurrentWebviewWindow } = window.__TAURI__.webviewWindow;

    const input = document.getElementById('note-input');
    const btn = document.getElementById('save-btn');
    const toast = document.getElementById('toast');
    const compose = document.getElementById('note-compose');
    const title = document.getElementById('note-title');
    const subtitle = document.getElementById('note-subtitle');
    const hint = document.getElementById('note-hint');

    // A note is stamped into whatever is being captured right now, so say
    // what that is before anyone types, and say plainly when it is nothing.
    const NOTE_TARGETS = {
      recording: {
        title: 'Note for this recording',
        subtitle: 'Stamped with the time and saved into this meeting’s notes.',
      },
      sensitive: {
        title: 'Marker for this sensitive meeting',
        subtitle: 'Saved with the time. Sensitive meetings capture nothing else.',
      },
    };
    let noteTarget = null;

    async function refreshNoteTarget() {
      try {
        noteTarget = await invoke('cmd_note_target');
      } catch (e) {
        console.error('Note target:', e);
        noteTarget = null;
      }
      const copy = NOTE_TARGETS[noteTarget];
      compose.hidden = !copy;
      hint.hidden = !copy;
      if (copy) {
        title.textContent = copy.title;
        subtitle.textContent = copy.subtitle;
        btn.textContent = 'Save Note';
        input.focus();
      } else {
        title.textContent = 'Nothing is recording';
        subtitle.textContent = 'Notes are stamped into a recording while it runs, so they land in that meeting’s notes. Start a recording, then press ⌘⇧N to add one.';
        btn.textContent = 'Close';
      }
      updateState();
    }

    function updateState() {
      btn.disabled = Boolean(noteTarget) && !input.value.trim();
    }

    input.addEventListener('input', updateState);

    async function saveNote() {
      if (!noteTarget) {
        getCurrentWebviewWindow().close();
        return;
      }
      const text = input.value.trim();
      if (!text) return;

      btn.disabled = true;
      try {
        await invoke('cmd_add_note', { text });
        input.value = '';
        updateState();

        // Flash success
        toast.classList.remove('error');
        toast.textContent = 'Note saved';
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => {
            getCurrentWebviewWindow().close();
          }, 200);
        }, 600);
      } catch (e) {
        // The recording can end between opening the window and saving. The
        // typed text stays in the field either way.
        await refreshNoteTarget();
        toast.textContent = noteTarget ? String(e) : 'The recording ended before the note was saved.';
        toast.classList.add('error');
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
          toast.classList.remove('error');
        }, 2000);
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', saveNote);

    // Cmd+Enter to save, Escape to close
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        saveNote();
      }
      if (e.key === 'Escape') {
        getCurrentWebviewWindow().close();
      }
    });

    refreshNoteTarget();
    getCurrentWebviewWindow().onFocusChanged(({ payload: focused }) => {
      if (focused) refreshNoteTarget();
    });
  </script>
</body>
</html>
