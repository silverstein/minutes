name: Release Windows Desktop

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run only the Windows Job memory-enforcement regression"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  windows_job_memory_validation:
    name: Validate Windows Job memory enforcement
    if: github.event_name == 'workflow_dispatch' && inputs.validation_only
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Execute focused Job Object regression
        run: >-
          cargo test -p minutes-core --no-default-features --lib
          bounded_child::windows_tests::windows_job_memory_limit_refuses_committed_memory_over_budget
          -- --exact --nocapture --test-threads=1

  release_readiness:
    name: Release readiness
    if: github.event_name != 'workflow_dispatch' || !inputs.validation_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify committed release invariants
        run: node scripts/check_version_sync.mjs --release

  windows-desktop:
    name: Build Windows desktop installer
    needs: release_readiness
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve runner image for cache scope
        id: runner-image
        shell: bash
        run: echo "scope=${ImageOS:-noimage}-${ImageVersion:-noversion}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Scope by runner image so a runner-image rotation does not restore a stale
          # target/ cache with toolchain paths the new image no longer ships. See ci.yml.
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-cargo-release-desktop-${{ hashFiles('**/Cargo.lock') }}

      - name: Clean stale Windows native build cache
        shell: bash
        run: |
          rm -rf \
            target/debug/build/whisper-rs-sys-* \
            target/release/build/whisper-rs-sys-* \
            target/debug/build/knf-rs-sys-* \
            target/release/build/knf-rs-sys-*

      - name: Cache ONNX Runtime binaries
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/dfbin
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-ort-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      # The app imports the MSVC runtime, which is not part of Windows. Without
      # these beside the executable it fails to start on a PC that has never had
      # the Visual C++ Redistributable, showing nothing at all (#657). Tauri
      # places bare-filename resources next to the exe, which is where the
      # loader looks. Staged here rather than committed so Microsoft binaries
      # stay out of the repo; the config uses globs so a local checkout without
      # them still builds.
      - name: Stage the MSVC runtime beside the app
        shell: pwsh
        working-directory: tauri/src-tauri
        run: |
          $ErrorActionPreference = 'Stop'
          $crt = Get-ChildItem 'C:\Program Files*\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT' -Directory -ErrorAction SilentlyContinue |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Could not locate the VC143 CRT redistributable on the runner' }
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) . -Force
          }
          $n = (Get-ChildItem 'vcruntime140*.dll','msvcp140*.dll').Count
          if ($n -ne 4) { throw "expected 4 runtime DLLs staged, found $n" }
          Write-Host "staged $n runtime DLLs from $($crt.FullName)"

      - name: Build desktop installer (unsigned)
        working-directory: tauri/src-tauri
        run: cargo tauri build --features parakeet --ci --bundles nsis --no-sign
        env:
          CARGO_NET_RETRY: 3
          # Cap ggml/whisper.cpp at AVX2-class instructions for the shipped
          # Windows binary. GitHub's Windows runners may expose AVX-512, and
          # whisper-rs-sys forwards GGML_* env vars straight into CMake.
          GGML_NATIVE: "OFF"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          GGML_AVX512: "OFF"
          GGML_AVX512_VBMI: "OFF"
          GGML_AVX512_VNNI: "OFF"
          GGML_AVX512_BF16: "OFF"

      - name: Rename desktop binary
        shell: bash
        run: cp -f target/release/minutes-app.exe minutes-desktop-windows-x64.exe

      - name: Rename NSIS installer
        shell: bash
        run: |
          mapfile -t installers < <(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' | sort)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "No NSIS installer .exe found under target/release/bundle/nsis" >&2
            exit 1
          fi
          cp -f "${installers[0]}" minutes-desktop-windows-x64-setup.exe

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minutes-desktop-windows-x64
          path: |
            minutes-desktop-windows-x64.exe
            minutes-desktop-windows-x64-setup.exe
          if-no-files-found: error

      - name: Attach desktop assets on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            minutes-desktop-windows-x64.exe
            minutes-desktop-windows-x64-setup.exe
