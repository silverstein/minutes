[package]
name = "minutes-embed-worker"
version = "0.0.0"
edition = "2021"
publish = false
description = "Isolated on-device text-embedding worker for Minutes semantic search"
build = "build.rs"

[[bin]]
name = "minutes-embed-worker"
path = "src/main.rs"

# Deliberately outside the workspace, like crates/sherpa-plugin: build.rs
# compiles a pinned llama.cpp (with Metal), which would otherwise land on every
# `cargo clippy --all`. It runs as its own process, so its ggml never shares an
# image with whisper.cpp's, and a crash or runaway allocation in the model
# runtime cannot take the app down.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
bindgen = "0.69.4"
cmake = "0.1"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
ureq = "2"

[profile.release]
lto = "thin"
codegen-units = 1
