name: Capture writer diagnostic (temporary)

on:
  push:
    branches: [diagnostic/live-input-progress-20261016]
    paths:
      - scripts/diagnose_capture_writer.py
      - scripts/diagnostics/capture_writer_probe.rs
      - .github/workflows/capture-writer-diagnostic.yml

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve exact runner image cache scope
        id: image
        shell: bash
        run: echo "scope=${ImageOS:-noimage}-${ImageVersion:-noversion}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ steps.image.outputs.scope }}-cargo-noincr-${{ hashFiles('**/Cargo.lock') }}
      - name: Compare original and observed synthetic writer fixture
        shell: bash
        run: python scripts/diagnose_capture_writer.py --output "$RUNNER_TEMP/capture-writer-evidence"
      - name: Preserve synthetic metadata and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-writer-evidence
          path: |
            ${{ runner.temp }}/capture-writer-evidence/*.json
            ${{ runner.temp }}/capture-writer-evidence/*.log
          if-no-files-found: error
          retention-days: 7
