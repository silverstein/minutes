[package]
name = "minutes-archive-convert"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded, network-denied document conversion worker for Minutes Archive"

[dependencies]
minutes-archive-worker-control = { path = "../archive-worker-control" }
# Pinned exactly. The crate is days old and shipped four releases on the day
# it was adopted, so a range would silently take a parser this project has
# not exercised. Its PDF path is never called -- see convert_via_anydoc.
anydoc = "=0.1.7"
flate2 = "=1.1.9"
libc = "0.2"
# Pinned to the exact version pdf-extract already carries, so the text-origin
# inspection reads the same parsed document the extractor reads, not a second
# parser's opinion of it.
lopdf = "=0.42.0"
pdf-extract = "=0.12.0"
quick-xml = "=0.42.0"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = "3"
thiserror = { workspace = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"

[[bin]]
name = "minutes-archive-convert-worker"
path = "src/main.rs"
