[package]
name = "minutes-speaker-worker"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Opt-in isolated full native speaker refinement worker for Minutes"

[dependencies]
speakrs = { git = "https://github.com/avencera/speakrs", rev = "af8013f95a53a37a554d8abc6e4ae2ab9a614be6", default-features = false, features = ["cpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = "1"
tempfile = "3"
ndarray = { version = "=0.17.2", features = ["blas"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[profile.release]
strip = true
lto = "thin"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
vcpkg = "=0.2.15"
