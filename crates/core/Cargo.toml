[package]
name = "minutes-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Core library for minutes — audio capture, transcription, and meeting memory"
keywords = ["meeting", "transcription", "whisper", "ai", "memory"]
categories = ["multimedia::audio", "command-line-utilities"]

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs", "whisper-guard/whisper"]
# Retained Parakeet preferences currently resolve to Whisper on every platform.
# Keep that fallback executable even in `--no-default-features --features parakeet` builds.
parakeet = ["whisper"]  # dormant subprocess contract; runtime selection stays gated until secure byte transport exists
diarize = ["dep:pyannote-rs", "dep:knf-rs", "dep:ort", "dep:ndarray"]
# Live speaker attribution via the external minutes-diarize-sidecar process.
# Pure subprocess IPC on this side -> intentionally NO parakeet-rs/ort dep, so it
# never collides with `diarize`'s pyannote-rs (ort rc.10 / ndarray 0.16).
streaming-diarize = ["streaming"]
coreml = ["whisper-rs/coreml"]
cuda = ["whisper-rs/cuda"]
hipblas = ["whisper-rs/hipblas"]
metal = ["whisper-rs/metal"]
vulkan = ["whisper-rs/vulkan"]
streaming = ["dep:crossbeam-channel"]
denoise = ["dep:nnnoiseless"]
# Streaming Silero VAD via ort. Implies streaming because every consumer
# (recording sidecar) needs streaming audio. ort + ndarray are already
# pulled in by `diarize`; cargo unifies them when both features are on.
vad-ort = ["streaming", "dep:ort", "dep:ndarray"]
# Opt-in SOTA transcription engine: sherpa-onnx + parakeet-tdt-0.6b-v3 (multilingual,
# no Python). Off by default; whisper.cpp stays the default.
#
# This enables the LOADER, not a static link. sherpa lives in a separate
# cdylib (crates/sherpa-plugin) that is dlopened at runtime, because sherpa and
# pyannote each vendor their own ONNX Runtime and kaldi-native-fbank, and one
# executable can only hold one copy of each: whichever wins breaks the other
# consumer (issue #683). Loading sherpa into its own image removes the conflict
# instead of arbitrating it (issue #685), so this feature now coexists with
# `diarize` and `vad-ort` on every platform.
# Implies `whisper` because the sherpa path promises a whisper fallback: when
# the plugin or model is unavailable, or sherpa fails after loading, whisper
# answers. Without it that fallback returns a diagnostic placeholder as if it
# were a transcript, which is worse than either engine failing honestly.
engine-sherpa = ["dep:libloading", "whisper"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }
which = { workspace = true }
tracing = { workspace = true }
cpal = { workspace = true }
hound = { workspace = true }
symphonia = { workspace = true }
notify = { workspace = true }
whisper-rs = { workspace = true, optional = true }
ureq = { workspace = true }
fs2 = { workspace = true }
schemars = { workspace = true }
crossbeam-channel = { workspace = true, optional = true }
crossbeam-queue = { workspace = true }
getrandom = { workspace = true }
interprocess = { workspace = true }
pyannote-rs = { workspace = true, optional = true }
knf-rs = { version = "0.3.2", optional = true }
ort = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
ndarray = { workspace = true, optional = true }
whisper-guard = { path = "../whisper-guard", version = "0.3.0" }
nnnoiseless = { workspace = true, optional = true }
base64 = "0.22"
rusqlite = { workspace = true }
sys-locale = { workspace = true }
tempfile = "3"
sha2 = "0.10"
cap-std = { workspace = true }
chacha20poly1305 = "0.10.1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
cidre = { version = "0.20.0", default-features = false, features = ["at", "av", "cat", "cf", "cm", "core_audio", "macos_14_4", "ns"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat"] }
mach2 = "0.6"
# Static sherpa-onnx on macOS so opt-in engine-sherpa builds produce apps/CLIs
# with no dangling @rpath dylib refs (the #369 packaging blocker; verified by
# real launch + transcription). `default-features = false` drops upstream `tts`.
# sherpa-rs moved to crates/sherpa-plugin (#685); nothing here links it.

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.14.0"
# sherpa-rs moved to crates/sherpa-plugin (#685).

# Native hotkey (CGEventTap) uses raw FFI — no extra crate deps needed.
# The macOS frameworks are linked automatically via #[link(name = "...")]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Dynamic on Windows, as before the macOS static fix (CI builds this gate on
# all three platforms; static archives are only wired up for macOS).
# sherpa-rs moved to crates/sherpa-plugin (#685).

[dev-dependencies]
hound = { workspace = true }
dirs = { workspace = true }
insta = { version = "1", features = ["json"] }

[[example]]
name = "dogfood_vad_engines"
required-features = ["streaming", "whisper"]

[[test]]
name = "integration"
path = "../../tests/integration/pipeline_test.rs"
