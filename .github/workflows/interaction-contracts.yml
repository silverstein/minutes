name: Portable interaction contracts

on:
  pull_request:
    paths:
      - 'crates/core/src/interaction/**'
      - 'tooling/interaction-contracts/**'
      - '.github/workflows/interaction-contracts.yml'
  push:
    branches: ['feat/interaction-continuity-core-20260915']
    paths:
      - 'crates/core/src/interaction/**'
      - 'tooling/interaction-contracts/**'
      - '.github/workflows/interaction-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - run: cargo test --manifest-path tooling/interaction-contracts/Cargo.toml
      - run: cargo fmt --manifest-path tooling/interaction-contracts/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tooling/interaction-contracts/Cargo.toml --all-targets -- -D warnings
