name: Apply continuity portability corrections

on:
  push:
    branches: ['feat/voice-continuity-integration-20260916']
    paths: ['.github/workflows/continuity-portability-fix.yml']

permissions:
  contents: write

jobs:
  correct:
    if: github.repository == 'silverstein/minutes' && github.ref == 'refs/heads/feat/voice-continuity-integration-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply exact portability corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              file = Path(path)
              value = file.read_text()
              assert value.count(old) == 1, (path, old)
              file.write_text(value.replace(old, new))
          root = 'crates/core/src/voice_live/'
          replace(root+'tools.rs', 'let rel = f.strip_prefix(root).unwrap_or(&f).to_string_lossy().to_string();', 'let rel = f.strip_prefix(root).unwrap_or(&f).components().map(|c| c.as_os_str().to_string_lossy()).collect::<Vec<_>>().join("/");')
          for filename, marker in [
              ('tools.rs', '\nfn host_outcome('),
              ('desktop.rs', '\n/// The stored exact host-approved payload, never a model-redeemed token.')
          ]:
              path = Path(root+filename)
              value = path.read_text()
              assert value.count(marker) == 1
              start = value.index(marker)
              prefix, helper = value[:start], value[start:]
              test = '\n#[cfg(test)]\nmod tests {'
              assert prefix.count(test) == 1
              assert helper.rstrip().endswith('}')
              path.write_text(prefix.replace(test, '\n'+helper.strip()+'\n'+test))
          replace(root+'desktop.rs', 'const ACTION_TIMEOUT: Duration = Duration::from_secs(20);', '#[cfg(target_os = "macos")]\nconst ACTION_TIMEOUT: Duration = Duration::from_secs(20);')
          replace(root+'mcp.rs', '    pid: u32,', '    #[cfg(unix)]\n    pid: u32,')
          replace(root+'mcp.rs', '        let pid = child.id();', '        #[cfg(unix)]\n        let pid = child.id();')
          replace(root+'mcp.rs', '            pid,', '            #[cfg(unix)]\n            pid,')
          replace(root+'mcp.rs', '            pid: 0,', '            #[cfg(unix)]\n            pid: 0,')
          replace(root+'mcp.rs', '                    helper.stdin.take().expect("piped stdin")', '                    let pipe = helper.stdin.take().expect("piped stdin");\n                    let _ = helper.wait();\n                    pipe')
          replace(root+'music.rs', '        assert!(MAX_LYRIC_CHARS > 200 && MAX_LYRIC_CHARS < 5_000);', '        const { assert!(MAX_LYRIC_CHARS > 200 && MAX_LYRIC_CHARS < 5_000) };')
          doc = Path('docs/architecture/voice-continuity-integration.md')
          with doc.open('a') as output:
              output.write('\n## Lint scope\n\nThe portable harness uses global `-D warnings`. The integrated voice-only\nall-targets configuration exposes inherited warnings in unrelated capture,\nknowledge, graph and other test modules. Its dedicated workflow therefore runs\nClippy on the actual core and CLI and fails all compiler errors plus every\nwarning touching changed Rust lines, while retaining other warnings in logs\nand an uploaded JSON artifact. Formatting checks every changed Rust file. This\nis a changed-code gate, not a claim that whole-workspace Clippy is clean. The\nrepository-wide and native release gates remain separate.\n')
          PY
          rustfmt --edition 2021 --config skip_children=true crates/core/src/voice_live/tools.rs crates/core/src/voice_live/desktop.rs crates/core/src/voice_live/mcp.rs crates/core/src/voice_live/music.rs
          git diff --check
          git add -- crates/core/src/voice_live/tools.rs crates/core/src/voice_live/desktop.rs crates/core/src/voice_live/mcp.rs crates/core/src/voice_live/music.rs docs/architecture/voice-continuity-integration.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(voice): use portable brain paths and resolve integration lint findings'
          git fetch origin feat/voice-continuity-integration-20260916
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/feat/voice-continuity-integration-20260916
