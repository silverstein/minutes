name: Community alerts

# Posts to Slack when someone other than a maintainer opens or replies to a
# discussion, issue or pull request, and once a day lists threads still
# waiting on a reply, so community posts get answered quickly.
#
# Needs the SLACK_COMMUNITY_WEBHOOK secret (a Slack incoming webhook). Without
# it, both jobs print what they would have posted and still succeed.
#
# pull_request_target runs with base-branch code and secrets available. This
# workflow never checks out or runs pull request code: it checks out only
# scripts/community_alerts.mjs from the default branch, and it reads PR titles
# and bodies from the event payload as data.

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  schedule:
    # 16:17 UTC = 8:17am Pacific standard time.
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  discussions: read
  issues: read
  pull-requests: read

jobs:
  alert:
    name: Alert on new community activity
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/community_alerts.mjs
          sparse-checkout-cone-mode: false

      - name: Post to Slack
        run: node scripts/community_alerts.mjs event
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_COMMUNITY_WEBHOOK }}

  sweep:
    name: List threads waiting on a reply
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: scripts/community_alerts.mjs
          sparse-checkout-cone-mode: false

      - name: Post the daily list to Slack
        run: node scripts/community_alerts.mjs sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_COMMUNITY_WEBHOOK }}
