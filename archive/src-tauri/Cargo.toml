[package]
name = "minutes-archive-app"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minutes Archive — private local legal evidence retrieval"

[dependencies]
minutes-archive-convert = { path = "../../crates/archive-convert" }
minutes-archive-core = { path = "../../crates/archive-core" }
minutes-archive-ocr = { path = "../../crates/archive-ocr" }
minutes-archive-semantic = { path = "../../crates/archive-semantic" }
minutes-archive-worker-control = { path = "../../crates/archive-worker-control" }
flate2 = "1"
base64 = "0.23"
minisign-verify = "0.2"
serde = { workspace = true }
sha2 = "0.10"
serde_json = { workspace = true }
tar = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }
