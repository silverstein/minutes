[package]
name = "minutes-archive-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Minutes Archive — private local legal evidence retrieval"

[dependencies]
minutes-archive-convert = { path = "../../crates/archive-convert" }
minutes-archive-core = { path = "../../crates/archive-core" }
minutes-archive-ocr = { path = "../../crates/archive-ocr" }
minutes-archive-semantic = { path = "../../crates/archive-semantic" }
serde = { workspace = true }
sha2 = "0.11"
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
