name: Release Windows Desktop

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run only the Windows Job memory-enforcement regression"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI_VERSION: "2.10.1"

jobs:
  windows_job_memory_validation:
    name: Validate Windows Job memory enforcement
    if: github.event_name == 'workflow_dispatch' && inputs.validation_only
    permissions:
      contents: read
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Execute focused Job Object regression
        run: >-
          cargo test -p minutes-core --no-default-features --lib
          bounded_child::windows_tests::windows_job_memory_limit_refuses_committed_memory_over_budget
          -- --exact --nocapture --test-threads=1

  release_readiness:
    name: Release readiness
    if: github.event_name != 'workflow_dispatch' || !inputs.validation_only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify committed release invariants
        run: node scripts/check_version_sync.mjs --release

  windows-desktop:
    name: Build Windows desktop installer
    needs: release_readiness
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve runner image for cache scope
        id: runner-image
        shell: bash
        run: echo "scope=${ImageOS:-noimage}-${ImageVersion:-noversion}" >> "$GITHUB_OUTPUT"

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Scope by runner image so a runner-image rotation does not restore a stale
          # target/ cache with toolchain paths the new image no longer ships. See ci.yml.
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-cargo-release-desktop-${{ hashFiles('**/Cargo.lock') }}

      - name: Clean stale Windows native build cache
        shell: bash
        run: |
          rm -rf \
            target/debug/build/whisper-rs-sys-* \
            target/release/build/whisper-rs-sys-* \
            target/debug/build/knf-rs-sys-* \
            target/release/build/knf-rs-sys-*

      - name: Cache ONNX Runtime binaries
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/dfbin
          key: ${{ runner.os }}-${{ steps.runner-image.outputs.scope }}-ort-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri CLI
        shell: bash
        run: cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked

      - name: Configure portable Windows CPU baseline
        shell: bash
        run: .github/scripts/export-windows-cpu-baseline.sh

      - name: Build desktop installer (unsigned)
        working-directory: tauri/src-tauri
        run: cargo tauri build --features parakeet --ci --bundles nsis --no-sign
        env:
          CARGO_NET_RETRY: 3

      - name: Rename desktop binary
        shell: bash
        run: cp -f target/release/minutes-app.exe minutes-desktop-windows-x64.exe

      # The raw exe imports the Visual C++ runtime, which Windows does not
      # include, so on a clean PC it exits 0xC0000135 printing nothing (#657).
      # The NSIS installer carries the runtime via bundle.resources; anyone
      # taking the bare binary gets nothing. Publish a zip that carries it too,
      # and keep the bare exe for existing links.
      - name: Package the raw desktop binary with its runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'minutes-desktop-windows-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'minutes-desktop-windows-x64.exe' (Join-Path $stage 'minutes-app.exe') -Force
          # build.rs already staged these next to the crate for the bundle.
          $staged = Get-ChildItem 'tauri/src-tauri/vcruntime140*.dll','tauri/src-tauri/msvcp140*.dll' -ErrorAction SilentlyContinue
          if (-not $staged) { throw 'build.rs staged no runtime DLLs; the desktop zip would repeat #657' }
          $staged | ForEach-Object { Copy-Item $_.FullName $stage -Force }
          Compress-Archive -Path "$stage/*" -DestinationPath 'minutes-desktop-windows-x64.zip' -Force
          Write-Host ("desktop zip MB: {0:N2}" -f ((Get-Item 'minutes-desktop-windows-x64.zip').Length/1MB))

      - name: Rename NSIS installer
        shell: bash
        run: |
          mapfile -t installers < <(find target/release/bundle/nsis -maxdepth 1 -type f -name '*.exe' | sort)
          if [ "${#installers[@]}" -eq 0 ]; then
            echo "No NSIS installer .exe found under target/release/bundle/nsis" >&2
            exit 1
          fi
          cp -f "${installers[0]}" minutes-desktop-windows-x64-setup.exe

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: minutes-desktop-windows-x64
          path: |
            minutes-desktop-windows-x64.exe
            minutes-desktop-windows-x64.zip
            minutes-desktop-windows-x64-setup.exe
          if-no-files-found: error

      - name: Attach desktop assets on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            minutes-desktop-windows-x64.exe
            minutes-desktop-windows-x64.zip
            minutes-desktop-windows-x64-setup.exe
