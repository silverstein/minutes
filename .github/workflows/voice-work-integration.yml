name: Voice Work integration
on:
  pull_request:
    paths:
      - 'crates/core/**'
      - 'crates/cli/**'
      - 'tauri/**'
      - 'scripts/test_workbench_browser.py'
      - '.github/workflows/voice-work-integration.yml'
      - 'Cargo.lock'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-work-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/apt-install.sh clang libclang-dev cmake build-essential pkg-config libasound2-dev libpipewire-0.3-dev libspa-0.2-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: macOS C++ headers
        if: runner.os == 'macOS'
        run: echo "CXXFLAGS=-I$(xcrun --show-sdk-path)/usr/include/c++/v1" >> "$GITHUB_ENV"
      - name: Runner identity
        id: image
        shell: bash
        run: echo "scope=${ImageOS:-none}-${ImageVersion:-none}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: voice-work-${{ runner.os }}-${{ steps.image.outputs.scope }}-${{ hashFiles('Cargo.lock') }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Real voice runtime tests (no device or sending tests)
        run: cargo test -p minutes-core --no-default-features --features voice-live --lib voice_live:: -- --test-threads=1
      - name: Real private persistence and continuity tests
        run: cargo test -p minutes-core --no-default-features --features voice-live --lib live_sidekick:: -- --test-threads=1
      - name: CLI feature build and work tests
        run: cargo test -p minutes-cli --no-default-features --features voice-live work:: -- --test-threads=1
      - name: Feature-enabled Clippy
        run: cargo clippy -p minutes-core -p minutes-cli --no-default-features --features voice-live --all-targets -- -D warnings
      - name: Desktop feature and host command type check
        run: cargo check -p minutes-app --features voice-live --tests
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_workbench_browser.py
        env:
          WORKBENCH_SCREENSHOT: workbench-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-browser
          path: workbench-smoke.png
          if-no-files-found: ignore
