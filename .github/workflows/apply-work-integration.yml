name: Reconcile work integration
on:
  push:
    branches: ['codex/work-continuity-20260916']
    paths: ['.integration-transfer/**', '.github/workflows/apply-work-integration.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'silverstein/minutes' && github.ref == 'refs/heads/codex/work-continuity-20260916'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply pinned main reconciliation and push-to-talk privacy fix
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib
          from pathlib import Path
          packed = Path('.integration-transfer/followup.gz').read_bytes()
          assert len(packed) == 7684
          patch = gzip.decompress(packed)
          assert len(patch) == 24127
          assert hashlib.sha256(patch).hexdigest() == 'f88ae0a23a4ffb7f34cdd46139d1212e4babb1d5c66dbd8ab73295681305c1b3'
          Path('/tmp/followup.patch').write_bytes(patch)
          PY
          git apply --check /tmp/followup.patch
          git apply /tmp/followup.patch
          cargo fmt --all
          git diff --check
      - name: Commit ordinary files on integration branch only
        shell: bash
        run: |
          rm -rf .integration-transfer
          git config user.name 'Minutes integration'
          git config user.email 'noreply@github.com'
          git add -A
          git diff --cached --exit-code -- .github/workflows
          git commit -m 'fix(work): preserve current-main fixes and make push-to-talk release synchronous'
          mkdir -p /tmp/work-integration-followup
          git rev-parse HEAD > /tmp/work-integration-followup/head.txt
          git rev-parse 'HEAD^{tree}' > /tmp/work-integration-followup/tree.txt
          git archive --format=zip --output=/tmp/work-integration-followup/source.zip HEAD
          git push origin HEAD:refs/heads/codex/work-continuity-20260916
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work-integration-followup
          path: /tmp/work-integration-followup/
          if-no-files-found: ignore
          retention-days: 1
